<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d3f8f">
<title>Listening de Francés · Valeria</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
<style>
  :root{
    --blue:#1d3f8f; --blue2:#2f5fd0; --red:#e0393e; --bg:#f4f6fb; --card:#fff;
    --ink:#1b2333; --muted:#667085; --ok:#1f9d55; --ko:#d64545; --line:#e3e7ef;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    touch-action:manipulation}
  body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
  header.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  header.top .flag{width:38px;height:26px;border-radius:5px;overflow:hidden;display:flex;box-shadow:0 1px 3px #0002}
  header.top .flag i{flex:1}
  header.top h1{font-size:20px;margin:0;flex:1}
  header.top button{background:none;border:none;font-size:15px;color:var(--blue2);font-weight:600;cursor:pointer;padding:8px}
  .card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 2px 10px #1d3f8f14;margin-bottom:16px}
  h2{margin:0 0 6px;font-size:26px}
  p{line-height:1.45}
  .muted{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
    padding:16px 22px;font-size:18px;font-weight:700;cursor:pointer;background:var(--blue2);color:#fff;
    box-shadow:0 3px 0 #1d3f8f;transition:transform .05s}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d3f8f}
  .btn.red{background:var(--red);box-shadow:0 3px 0 #a72428}
  .btn.ghost{background:#eef2fb;color:var(--blue);box-shadow:0 3px 0 #cdd6ea}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.block{width:100%}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
  .mode{border:3px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit}
  .mode.sel{border-color:var(--blue2);background:#eef3ff}
  .mode b{display:block;font-size:18px;margin-bottom:4px}
  .mode span{font-size:14px;color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>.btn{flex:1}
  .warn{background:#fff4e5;border:1px solid #ffd59a;color:#7a4a00;padding:12px 14px;border-radius:12px;font-size:15px;margin-top:12px}
  .hist{font-size:15px;margin:6px 0 0;padding-left:18px}
  /* quiz */
  .progress{height:10px;background:#dde3f0;border-radius:10px;overflow:hidden;margin-bottom:8px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--red));transition:width .3s}
  .qhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);margin-bottom:12px}
  .chip{background:#eef2fb;color:var(--blue);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
  .instr{font-size:21px;font-weight:700;margin:4px 0 16px}
  .player{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .play{width:96px;height:96px;border-radius:50%;font-size:42px;padding:0}
  .play.playing{animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 12px #2f5fd033}}
  .slow{padding:12px 16px;font-size:16px}
  .plays{font-size:14px;color:var(--muted)}
  .display{font-size:24px;font-weight:700;background:#f7f8fc;border:2px dashed #cfd7ea;border-radius:14px;padding:14px 16px;margin-bottom:18px;text-align:center}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:16px 12px;font-size:19px;font-weight:600;cursor:pointer;
    min-height:76px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--ink);font-family:inherit}
  .opt .em{font-size:30px}
  .opt.sel{border-color:var(--blue2);background:#eef3ff}
  .opt.ok{border-color:var(--ok);background:#e7f7ee}
  .opt.ko{border-color:var(--ko);background:#fdecec}
  .opt.sw{min-height:96px}
  .sw i{display:block;width:100%;height:64px;border-radius:10px;border:1px solid #0002}
  .opts.three{grid-template-columns:1fr 1fr 1fr}
  .opts.big .opt{font-size:30px}
  .feedback{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:17px;line-height:1.45}
  .feedback.ok{background:#e7f7ee;color:#11603a}
  .feedback.ko{background:#fdecec;color:#8a1f1f}
  .feedback .fr{font-weight:700}
  .tip{display:block;margin-top:6px;font-size:15px;opacity:.9}
  .next{margin-top:18px}
  /* results */
  .score{font-size:76px;font-weight:800;text-align:center;margin:4px 0;color:var(--blue)}
  .score small{font-size:30px;color:var(--muted)}
  .msg{text-align:center;font-size:20px;font-weight:700;margin:0 0 6px}
  .rev{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:12px}
  .rev .ic{font-size:26px;width:32px;flex:none}
  .rev .bd{flex:1;font-size:16px;line-height:1.45}
  .rev .mini{background:#eef2fb;border:none;border-radius:10px;padding:8px 10px;font-size:18px;cursor:pointer;height:44px;flex:none}
  .rev .fr{font-weight:700}
  .good{color:var(--ok);font-weight:700}
  .bad{color:var(--ko);font-weight:700;text-decoration:line-through}
  /* vocab */
  .vsec h3{margin:0 0 10px;font-size:20px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
  .tag:active{background:#eef3ff}
  .tag small{display:block;color:var(--muted);font-size:13px}
  .tag .dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid #0003}
  table.conj{border-collapse:collapse;width:100%;font-size:16px}
  table.conj td{padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  table.conj td:first-child{font-weight:700}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .rule{background:#f7f8fc;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.6}
  @media (max-width:520px){
    .opts.three{grid-template-columns:1fr}
    .modes{grid-template-columns:1fr}
    .instr{font-size:19px}
    .opt{font-size:17px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="flag"><i style="background:#0055a4"></i><i style="background:#fff"></i><i style="background:#ef4135"></i></div>
    <h1>Listening de Francés</h1>
    <button id="homeBtn" onclick="goHome()" hidden>🏠 Inicio</button>
  </header>
  <main id="app"></main>
</div>

<script>
/* ================== DATOS ================== */
const COLORS = [
  {fr:'rouge', frF:'rouge', es:'rojo', esF:'roja', hex:'#e53935'},
  {fr:'bleu', frF:'bleue', es:'azul', esF:'azul', hex:'#1e63d6'},
  {fr:'vert', frF:'verte', es:'verde', esF:'verde', hex:'#2e9d44'},
  {fr:'jaune', frF:'jaune', es:'amarillo', esF:'amarilla', hex:'#fdd835'},
  {fr:'noir', frF:'noire', es:'negro', esF:'negra', hex:'#212121'},
  {fr:'blanc', frF:'blanche', es:'blanco', esF:'blanca', hex:'#ffffff'},
  {fr:'gris', frF:'grise', es:'gris', esF:'gris', hex:'#9e9e9e'},
  {fr:'rose', frF:'rose', es:'rosa', esF:'rosa', hex:'#f48fb1'},
  {fr:'orange', frF:'orange', es:'naranja', esF:'naranja', hex:'#fb8c00'},
  {fr:'violet', frF:'violette', es:'morado', esF:'morada', hex:'#8e24aa'},
  {fr:'marron', frF:'marron', es:'marrón', esF:'marrón', hex:'#6d4c41'},
];

const MATERIALS = [
  {fr:'stylo', art:'le', g:'m', es:'bolígrafo', esArt:'el', esG:'m', e:'🖊️'},
  {fr:'feutre', art:'le', g:'m', es:'subrayador', esArt:'el', esG:'m', e:'🖍️'},
  {fr:'ciseaux', art:'les', g:'pl', es:'tijeras', esArt:'las', esG:'fpl', e:'✂️'},
  {fr:'trousse', art:'la', g:'f', es:'estuche', esArt:'el', esG:'m', e:'👝'},
  {fr:'sac à dos', art:'le', g:'m', es:'mochila', esArt:'la', esG:'f', e:'🎒'},
  {fr:'taille-crayon', art:'le', g:'m', es:'sacapuntas', esArt:'el', esG:'m', e:'🔺'},
  {fr:'bâton de colle', art:'le', g:'m', es:'pegamento', esArt:'el', esG:'m', e:'🧴'},
  {fr:'règle', art:'la', g:'f', es:'regla', esArt:'la', esG:'f', e:'📏'},
  {fr:'cahier', art:'le', g:'m', es:'cuaderno', esArt:'el', esG:'m', e:'📓'},
  {fr:'classeur', art:'le', g:'m', es:'archivador', esArt:'el', esG:'m', e:'🗂️'},
  {fr:'livre', art:'le', g:'m', es:'libro', esArt:'el', esG:'m', e:'📕'},
  {fr:'gomme', art:'la', g:'f', es:'goma', esArt:'la', esG:'f', e:'🧽'},
  {fr:'crayon', art:'le', g:'m', es:'lápiz', esArt:'el', esG:'m', e:'✏️'},
  {fr:'trombone', art:'le', g:'m', es:'clip', esArt:'el', esG:'m', e:'📎'},
  {fr:'ordinateur', art:"l'", g:'m', es:'ordenador', esArt:'el', esG:'m', e:'💻'},
];

const COUNTRIES = [
  {fr:'France', art:'la', prep:'en', es:'Francia', flag:'🇫🇷', natM:'français', natF:'française', esM:'francés', esF:'francesa', lang:'français', city:'Paris', cityEs:'París'},
  {fr:'Espagne', art:"l'", prep:'en', es:'España', flag:'🇪🇸', natM:'espagnol', natF:'espagnole', esM:'español', esF:'española', lang:'espagnol', city:'Madrid', cityEs:'Madrid', sameSound:true},
  {fr:'Allemagne', art:"l'", prep:'en', es:'Alemania', flag:'🇩🇪', natM:'allemand', natF:'allemande', esM:'alemán', esF:'alemana', lang:'allemand', city:'Berlin', cityEs:'Berlín'},
  {fr:'Italie', art:"l'", prep:'en', es:'Italia', flag:'🇮🇹', natM:'italien', natF:'italienne', esM:'italiano', esF:'italiana', lang:'italien', city:'Rome', cityEs:'Roma'},
  {fr:'Portugal', art:'le', prep:'au', es:'Portugal', flag:'🇵🇹', natM:'portugais', natF:'portugaise', esM:'portugués', esF:'portuguesa', lang:'portugais', city:'Lisbonne', cityEs:'Lisboa'},
  {fr:'Belgique', art:'la', prep:'en', es:'Bélgica', flag:'🇧🇪', natM:'belge', natF:'belge', esM:'belga', esF:'belga', lang:'français', city:'Bruxelles', cityEs:'Bruselas'},
  {fr:'Royaume-Uni', art:'le', prep:'au', es:'Reino Unido', flag:'🇬🇧', natM:'britannique', natF:'britannique', esM:'británico', esF:'británica', lang:'anglais', city:'Londres', cityEs:'Londres'},
  {fr:'Maroc', art:'le', prep:'au', es:'Marruecos', flag:'🇲🇦', natM:'marocain', natF:'marocaine', esM:'marroquí', esF:'marroquí', lang:'arabe', city:'Rabat', cityEs:'Rabat'},
  {fr:'États-Unis', art:'les', prep:'aux', es:'Estados Unidos', flag:'🇺🇸', natM:'américain', natF:'américaine', esM:'estadounidense', esF:'estadounidense', lang:'anglais', city:'New York', cityEs:'Nueva York'},
];
const LANGS_ES = {'français':'francés','espagnol':'español','allemand':'alemán','italien':'italiano','portugais':'portugués','anglais':'inglés','arabe':'árabe'};

const PROFESSIONS = [
  {m:'écrivain', f:'écrivaine', artM:"l'", artF:"l'", esM:'escritor', esF:'escritora', e:'✍️'},
  {m:'photographe', f:'photographe', artM:'le', artF:'la', esM:'fotógrafo', esF:'fotógrafa', e:'📷'},
  {m:'étudiant', f:'étudiante', artM:"l'", artF:"l'", esM:'estudiante', esF:'estudiante', e:'🎓'},
  {m:'sportif', f:'sportive', artM:'le', artF:'la', esM:'deportista', esF:'deportista', e:'⚽'},
  {m:'acteur', f:'actrice', artM:"l'", artF:"l'", esM:'actor', esF:'actriz', e:'🎭'},
  {m:'chanteur', f:'chanteuse', artM:'le', artF:'la', esM:'cantante', esF:'cantante', e:'🎤'},
  {m:'cuisinier', f:'cuisinière', artM:'le', artF:'la', esM:'cocinero', esF:'cocinera', e:'🧑‍🍳'},
];

// parts = forma verbal sin pronombre (je, tu, il/elle, nous, vous, ils/elles)
const VERBS = [
  {inf:'parler', es:'hablar', elide:false, parts:['parle','parles','parle','parlons','parlez','parlent'],
   esC:['hablo','hablas','habla','hablamos','habláis','hablan']},
  {inf:'écouter', es:'escuchar', elide:true, parts:['écoute','écoutes','écoute','écoutons','écoutez','écoutent'],
   esC:['escucho','escuchas','escucha','escuchamos','escucháis','escuchan']},
  {inf:"s'appeler", es:'llamarse', elide:false, parts:["m'appelle","t'appelles","s'appelle","nous appelons","vous appelez","s'appellent"],
   esC:['me llamo','te llamas','se llama','nos llamamos','os llamáis','se llaman']},
  {inf:'habiter', es:'vivir', elide:true, parts:['habite','habites','habite','habitons','habitez','habitent'],
   esC:['vivo','vives','vive','vivimos','vivís','viven']},
  {inf:'être', es:'ser / estar', elide:false, parts:['suis','es','est','sommes','êtes','sont'],
   esC:['soy / estoy','eres / estás','es / está','somos / estamos','sois / estáis','son / están']},
];
const NAMES_M = ['Lucas','Hugo','Louis','Nathan','Théo','Jules','Paul','Antoine'];
const NAMES_F = ['Léa','Chloé','Emma','Camille','Manon','Zoé','Julie','Inès'];

/* ================== UTILIDADES ================== */
const rand = n => Math.floor(Math.random()*n);
const pick = a => a[rand(a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (a,n) => shuffle(a).slice(0,n);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const withArt = (word, art) => art==="l'" ? "l'"+word : art+' '+word;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function person(i){
  if(i===2){ const f=Math.random()<.5; return {fr:f?'elle':'il', es:f?'ella':'él'}; }
  if(i===5){ const f=Math.random()<.5; return {fr:f?'elles':'ils', es:f?'ellas':'ellos'}; }
  return [{fr:'je',es:'yo'},{fr:'tu',es:'tú'},null,{fr:'nous',es:'nosotros'},{fr:'vous',es:'vosotros'}][i];
}
function frForm(v,i,pron){
  const part=v.parts[i];
  if(pron==='je' && v.elide) return "j'"+part;
  return pron+' '+part;
}
const HABITER = [
  {fr:"J'habite", es:'Vivo'},{fr:'Tu habites', es:'Vives'},{fr:'Il habite', es:'Él vive'},
  {fr:'Elle habite', es:'Ella vive'},{fr:'Nous habitons', es:'Vivimos'},{fr:'Vous habitez', es:'Vivís'},
];

// Construye la pregunta mezclando opciones
function mkQ(o){
  const opts = shuffle([{...o.correct, _c:true}, ...o.wrong]);
  return {...o, options:opts, answer:opts.findIndex(x=>x._c)};
}

/* ================== GENERADORES DE PREGUNTAS ================== */
const GEN = {
  color(){
    const [c,...d]=sample(COLORS,4);
    return mkQ({topic:'Colores', instr:'¿Qué color oyes?', say:c.fr, es:c.es, kind:'swatch',
      correct:{swatch:c.hex, text:c.es}, wrong:d.map(x=>({swatch:x.hex,text:x.es}))});
  },
  material(){
    const [m,...d]=sample(MATERIALS,4);
    const lab = x => ({em:x.e, text:x.es});
    return mkQ({topic:'Material escolar', instr:'¿Qué objeto oyes?', say:withArt(m.fr,m.art), es:`${m.esArt} ${m.es}`,
      correct:lab(m), wrong:d.map(lab)});
  },
  materialColor(){
    const pool=MATERIALS.filter(x=>x.g!=='pl');
    const [m,m2]=sample(pool,2); const [c,c2]=sample(COLORS,2);
    const fr = (mm,cc)=>`${cap(withArt(mm.fr,mm.art))} est ${mm.g==='f'?cc.frF:cc.fr}.`;
    const es = (mm,cc)=>`${cap(mm.esArt)} ${mm.es} es ${mm.esG==='f'?cc.esF:cc.es}`;
    const lab = (mm,cc)=>({em:mm.e, dot:cc.hex, text:es(mm,cc)});
    return mkQ({topic:'Material + colores', instr:'Escucha la frase. ¿Qué significa?', say:fr(m,c), es:es(m,c)+'.',
      tip: m.g==='f' && c.fr!==c.frF ? `Con palabras femeninas el color cambia: ${c.fr} → ${c.frF}.` : '',
      correct:lab(m,c), wrong:[lab(m2,c),lab(m,c2),lab(m2,c2)]});
  },
  article(){
    const items=[
      ...MATERIALS.map(m=>({fr:m.fr, art:m.art, es:`${m.esArt} ${m.es}`, know:true})),
      ...COUNTRIES.map(c=>({fr:c.fr, art:c.art, es:c.es, know:true})),
      ...PROFESSIONS.flatMap(p=>[{fr:p.m,art:p.artM,es:p.esM},{fr:p.f,art:p.artF,es:p.esF}]),
    ];
    // Aseguramos variedad: a veces forzamos l' o les
    let it = Math.random()<.35 ? pick(items.filter(i=>i.art==="l'"||i.art==='les')) : pick(items);
    const know = it.know && Math.random()<.5;
    const opts=['le','la',"l'",'les'];
    const tip={"l'":"Delante de vocal o h se usa l'.", 'les':'Les = plural.', 'le':'Le = masculino singular.', 'la':'La = femenino singular.'}[it.art];
    return mkQ({topic:'Artículos', kind:'big',
      instr: know ? 'Escucha la palabra. ¿Qué artículo lleva?' : '¿Qué artículo oyes?',
      say: know ? it.fr : withArt(it.fr,it.art), es: it.es, tip,
      correct:{text:it.art}, wrong:opts.filter(a=>a!==it.art).map(a=>({text:a}))});
  },
  verbMeaning(){
    const i=rand(6), p=person(i);
    const [v,...d]=sample(VERBS,4);
    const lab = vv=>({text:cap(`${p.es} ${vv.esC[i]}`)});
    return mkQ({topic:`Verbos`, instr:'Escucha. ¿Qué significa?', say:cap(frForm(v,i,p.fr))+'.', es:cap(`${p.es} ${v.esC[i]}`)+'.',
      tip:`Verbo ${v.inf} = ${v.es}.`, correct:lab(v), wrong:d.map(lab)});
  },
  verbSpelling(){
    const i=rand(6), p=person(i), v=pick(VERBS);
    const ok=frForm(v,i,p.fr);
    const others=[...new Set([0,1,2,3,4,5].filter(j=>j!==i).map(j=>frForm(v,j,p.fr)))].filter(x=>x!==ok);
    return mkQ({topic:'Verbos', instr:'Escucha. ¿Cómo se escribe bien?', say:cap(ok)+'.', es:cap(`${p.es} ${v.esC[i]}`)+'.',
      tip:`${v.inf}: ${p.fr} → ${v.parts[i]}`, correct:{text:ok}, wrong:sample(others,3).map(t=>({text:t}))});
  },
  countryWhere(){
    const [c,...d]=sample(COUNTRIES,4); const s=pick(HABITER);
    const lab=x=>({em:x.flag, text:x.es});
    return mkQ({topic:'Países', instr:'¿En qué país vive?', say:`${s.fr} ${c.prep==='en'?'en':c.prep} ${c.fr}.`,
      es:`${s.es} en ${c.es}.`, correct:lab(c), wrong:d.map(lab)});
  },
  preposition(){
    const s=pick(HABITER); const city=Math.random()<.3; const c=pick(COUNTRIES);
    const prep = city ? 'à' : c.prep;
    const place = city ? c.city : c.fr;
    const tip = {
      'à':'À + ciudad (à Paris, à Madrid).',
      'au':`Au + país masculino (le ${c.fr} → au ${c.fr}).`,
      'aux':`Aux + país plural (les ${c.fr} → aux ${c.fr}).`}[prep];
    return mkQ({topic:'À · En · Au · Aux', kind:'big', instr:'Escucha y completa la frase.',
      display:`${s.fr} ___ ${place}.`, say:`${s.fr} ${prep} ${place}.`,
      es:`${s.es} en ${city?c.cityEs:c.es}.`,
      tip: prep==='en' ? `En + país femenino o que empieza por vocal (${withArt(c.fr,c.art)} → en ${c.fr}).` : tip,
      correct:{text:prep}, wrong:['à','en','au','aux'].filter(x=>x!==prep).map(t=>({text:t}))});
  },
  nationality(){
    const f=Math.random()<.5; const [c,...d]=sample(COUNTRIES,3);
    const lab=(x,fem)=>({em:x.flag, text:`${fem?'Ella':'Él'} es ${fem?x.esF:x.esM}`});
    const wrong=[lab(c,!f), ...d.map(x=>lab(x,f))];
    return mkQ({topic:'Nacionalidades', instr:'Escucha. ¿Qué significa?', say:`${f?'Elle':'Il'} est ${f?c.natF:c.natM}.`,
      es:lab(c,f).text+'.', tip: c.natM===c.natF ? `${c.natM} es igual en masculino y femenino.` : `${c.natM} (masc.) → ${c.natF} (fem.)`,
      correct:lab(c,f), wrong});
  },
  profession(){
    const f=Math.random()<.5; const [p,...d]=sample(PROFESSIONS,3);
    const lab=(x,fem)=>({em:x.e, text:`${fem?'Ella':'Él'} es ${fem?x.esF:x.esM}`});
    return mkQ({topic:'Profesiones', instr:'Escucha. ¿Qué significa?', say:`${f?'Elle':'Il'} est ${f?p.f:p.m}.`,
      es:lab(p,f).text+'.', tip: p.m===p.f ? `${p.m} es igual en masculino y femenino.` : `${p.m} (masc.) → ${p.f} (fem.)`,
      correct:lab(p,f), wrong:[lab(p,!f),...d.map(x=>lab(x,f))]});
  },
  boyOrGirl(){
    // Mezcla profesiones y nacionalidades; a veces una que suena igual
    const items=[
      ...PROFESSIONS.map(p=>({m:p.m,f:p.f,esM:p.esM,esF:p.esF,same:p.m===p.f})),
      ...COUNTRIES.map(c=>({m:c.natM,f:c.natF,esM:c.esM,esF:c.esF,same:c.natM===c.natF||!!c.sameSound})),
    ];
    const it = Math.random()<.25 ? pick(items.filter(x=>x.same)) : pick(items.filter(x=>!x.same));
    const fem=Math.random()<.5; const word=fem?it.f:it.m;
    const ans = it.same ? 2 : (fem?1:0);
    const opts=[{em:'👦',text:'Un chico'},{em:'👧',text:'Una chica'},{em:'🤷',text:'No se puede saber'}];
    const tip = it.same ? `«${it.m}» y «${it.f}» suenan igual: con «Je suis» no se puede saber.`
                        : `${it.m} (chico) / ${it.f} (chica).`;
    return {topic:'Masculino / femenino', kind:'three', instr:'¿Lo dice un chico o una chica?', say:`Je suis ${word}.`,
      es:`Soy ${fem?it.esF:it.esM}.`, tip, options:opts, answer:ans};
  },
  monologue(){
    const fem=Math.random()<.5; const name=pick(fem?NAMES_F:NAMES_M);
    const c=pick(COUNTRIES); const p=pick(PROFESSIONS);
    const nat=fem?c.natF:c.natM, prof=fem?p.f:p.m;
    const say=`Bonjour ! Je m'appelle ${name}. J'habite à ${c.city}, ${c.prep} ${c.fr}. Je suis ${nat}. Je suis ${prof} et je parle ${c.lang}.`;
    const es=`¡Hola! Me llamo ${name}. Vivo en ${c.cityEs}, en ${c.es}. Soy ${fem?c.esF:c.esM}. Soy ${fem?p.esF:p.esM} y hablo ${LANGS_ES[c.lang]}.`;
    const kind=pick(['where','prof','nat','name','lang']);
    const base={topic:'Comprensión', say, es, slowDefault:true};
    if(kind==='where'){
      const d=sample(COUNTRIES.filter(x=>x!==c),3); const lab=x=>({em:x.flag,text:x.es});
      return mkQ({...base, instr:'Escucha a esta persona. ¿En qué país vive?', correct:lab(c), wrong:d.map(lab)});
    }
    if(kind==='prof'){
      const d=sample(PROFESSIONS.filter(x=>x!==p),3); const lab=x=>({em:x.e,text:fem?x.esF:x.esM});
      return mkQ({...base, instr:'Escucha a esta persona. ¿Cuál es su profesión?', correct:lab(p), wrong:d.map(lab)});
    }
    if(kind==='nat'){
      const d=sample(COUNTRIES.filter(x=>x!==c),3); const lab=x=>({text:cap(fem?x.esF:x.esM)});
      return mkQ({...base, instr:'Escucha a esta persona. ¿Cuál es su nacionalidad?', correct:lab(c), wrong:d.map(lab)});
    }
    if(kind==='name'){
      const d=sample((fem?NAMES_F:NAMES_M).filter(x=>x!==name),3);
      return mkQ({...base, instr:'Escucha a esta persona. ¿Cómo se llama?', correct:{text:name}, wrong:d.map(t=>({text:t}))});
    }
    const langs=[...new Set(Object.keys(LANGS_ES))].filter(l=>l!==c.lang);
    return mkQ({...base, instr:'Escucha a esta persona. ¿Qué idioma habla?', correct:{text:cap(LANGS_ES[c.lang])},
      wrong:sample(langs,3).map(l=>({text:cap(LANGS_ES[l])}))});
  },
};

function buildExam(){
  // 12 tipos de pregunta: elegimos 10 distintos, en orden aleatorio
  const types=sample(Object.keys(GEN),10);
  const seen=new Set();
  return types.map(t=>{ let q,tries=0; do{ q=GEN[t](); tries++; } while(seen.has(q.say) && tries<20); seen.add(q.say); return q; });
}

/* ================== VOZ ================== */
let frVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  const fr=vs.filter(v=>/^fr/i.test(v.lang));
  const frFR=fr.filter(v=>/fr[-_]FR/i.test(v.lang));
  frVoice = frFR.find(v=>/google|amélie|amelie|thomas|audrey|marie|denise|julie|hortense/i.test(v.name))
         || frFR[0] || fr[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text, rate, onend){
  if(!('speechSynthesis' in window)){ alert('Este navegador no puede leer en voz alta. Prueba con Safari o Chrome.'); return; }
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice;
  u.rate=rate||0.9; u.pitch=1;
  u.onend=u.onerror=()=>onend&&onend();
  speechSynthesis.speak(u);
}

/* ================== ESTADO Y PANTALLAS ================== */
const app=document.getElementById('app');
const homeBtn=document.getElementById('homeBtn');
const MAX_PLAYS=3;
let S={mode:localStorage.getItem('fr_mode')||'practica'};

function history(){ try{return JSON.parse(localStorage.getItem('fr_hist')||'[]');}catch(e){return [];} }

function goHome(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  homeBtn.hidden=true;
  const h=history();
  app.innerHTML=`
  <div class="card">
    <h2>¡Hola, Valeria! 👋</h2>
    <p class="muted">Examen de <b>Listening</b>: escucha el audio en francés y elige la respuesta. Son <b>10 preguntas</b> y cada vez salen distintas.</p>
    <div class="modes">
      <button class="mode ${S.mode==='practica'?'sel':''}" onclick="setMode('practica')">
        <b>🎯 Modo práctica</b><span>Puedes escuchar las veces que quieras y te corrijo en cada pregunta.</span></button>
      <button class="mode ${S.mode==='examen'?'sel':''}" onclick="setMode('examen')">
        <b>📝 Modo examen</b><span>Máximo ${MAX_PLAYS} escuchas por pregunta. La nota y la corrección, al final.</span></button>
    </div>
    <button class="btn red block" onclick="startExam()">▶️ Empezar examen</button>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" onclick="speak('Bonjour Valeria ! Tu es prête pour l\\'examen ?')">🔊 Probar sonido</button>
      <button class="btn ghost" onclick="showVocab()">📚 Repasar vocabulario</button>
    </div>
    <div id="voiceWarn"></div>
  </div>
  ${h.length?`<div class="card"><b>Tus últimas notas</b><ul class="hist">${h.slice(-6).reverse().map(x=>`<li>${x.d} · ${x.m==='examen'?'Examen':'Práctica'}: <b>${x.s} / 10</b></li>`).join('')}</ul></div>`:''}
  <div class="card muted" style="font-size:14px">🎧 Consejo: usa auriculares y sube el volumen. Si no se oye nada en iPad, quita el modo silencio.</div>`;
  setTimeout(()=>{
    const w=document.getElementById('voiceWarn'); if(!w) return;
    if(!('speechSynthesis' in window)) w.innerHTML='<div class="warn">Este navegador no puede leer en voz alta. Usa Safari (iPad) o Chrome (Android).</div>';
    else if(!frVoice) w.innerHTML='<div class="warn">No encuentro una voz francesa en este dispositivo; puede sonar con acento raro. En iPad: Ajustes → Accesibilidad → Contenido leído → Voces → Francés.</div>';
  },1200);
}
function setMode(m){ S.mode=m; localStorage.setItem('fr_mode',m); goHome(); }

function startExam(){
  S.exam=buildExam(); S.i=0; S.answers=[]; S.plays=0; S.sel=null; S.locked=false;
  homeBtn.hidden=false;
  renderQ(true);
}

function optHTML(o,idx,q){
  const cls=['opt']; if(q.kind==='swatch') cls.push('sw');
  let inner='';
  if(o.swatch) inner=`<i style="background:${o.swatch}"></i>`;
  else inner=`${o.em?`<span class="em">${o.em}</span>`:''}${o.dot?`<span class="dot" style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${o.dot};border:1px solid #0003"></span>`:''}<span>${esc(o.text)}</span>`;
  return `<button class="${cls.join(' ')}" data-i="${idx}" onclick="choose(${idx})" aria-label="${esc(o.text)}">${inner}</button>`;
}

function renderQ(autoplay){
  const q=S.exam[S.i]; const n=S.exam.length;
  S.plays=0; S.sel=null; S.locked=false;
  const optsCls = q.kind==='three'?'opts three':q.kind==='big'?'opts big':'opts';
  app.innerHTML=`
  <div class="card">
    <div class="progress"><i style="width:${(S.i)/n*100}%"></i></div>
    <div class="qhead"><span>Pregunta <b>${S.i+1}</b> de ${n}</span><span class="chip">${esc(q.topic)}</span></div>
    <div class="instr">${esc(q.instr)}</div>
    <div class="player">
      <button class="btn play" id="playBtn" onclick="play(false)" aria-label="Escuchar">🔊</button>
      <button class="btn ghost slow" id="slowBtn" onclick="play(true)">🐢 Más lento</button>
      <span class="plays" id="plays"></span>
    </div>
    ${q.display?`<div class="display">${esc(q.display)}</div>`:''}
    <div class="${optsCls}" id="opts">${q.options.map((o,i)=>optHTML(o,i,q)).join('')}</div>
    <div id="fb"></div>
    <button class="btn block next" id="nextBtn" onclick="next()" ${S.mode==='examen'?'disabled':'hidden'}>${S.i===n-1?'Terminar ✅':'Siguiente ➡️'}</button>
  </div>`;
  updatePlays();
  if(autoplay) play(!!q.slowDefault);
}

function updatePlays(){
  const el=document.getElementById('plays'); if(!el) return;
  if(S.mode==='examen'){
    const left=MAX_PLAYS-S.plays;
    el.textContent = left>0 ? `Te quedan ${left} escucha${left===1?'':'s'}` : 'Ya no quedan escuchas';
    document.getElementById('playBtn').disabled=left<=0;
    document.getElementById('slowBtn').disabled=left<=0;
  } else el.textContent = S.plays? `Escuchado ${S.plays} ${S.plays===1?'vez':'veces'}` : '';
}

function play(slow){
  const q=S.exam[S.i];
  if(S.mode==='examen' && S.plays>=MAX_PLAYS) return;
  S.plays++; updatePlays();
  const b=document.getElementById('playBtn'); b.classList.add('playing');
  speak(q.say, slow?0.65:0.9, ()=>b&&b.classList.remove('playing'));
}

function choose(i){
  if(S.locked) return;
  const q=S.exam[S.i];
  S.sel=i;
  document.querySelectorAll('#opts .opt').forEach(b=>b.classList.toggle('sel', +b.dataset.i===i));
  if(S.mode==='examen'){ document.getElementById('nextBtn').disabled=false; return; }
  // práctica: corregir al momento
  S.locked=true;
  const ok=i===q.answer;
  document.querySelectorAll('#opts .opt').forEach(b=>{
    const k=+b.dataset.i; b.classList.remove('sel');
    if(k===q.answer) b.classList.add('ok'); else if(k===i) b.classList.add('ko');
  });
  document.getElementById('fb').innerHTML=`
    <div class="feedback ${ok?'ok':'ko'}">
      ${ok?'✅ ¡Muy bien!':'❌ ¡Casi! La respuesta correcta es: <b>'+esc(q.options[q.answer].text)+'</b>'}<br>
      Has oído: <span class="fr">«${esc(q.say)}»</span><br>
      <span class="muted" style="color:inherit">= ${esc(q.es)}</span>
      ${q.tip?`<span class="tip">💡 ${esc(q.tip)}</span>`:''}
    </div>`;
  const nb=document.getElementById('nextBtn'); nb.hidden=false;
}

function next(){
  if(S.sel===null) return;
  S.answers.push(S.sel);
  if(S.i<S.exam.length-1){ S.i++; renderQ(true); window.scrollTo(0,0); }
  else showResults();
}

function showResults(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  const score=S.exam.reduce((a,q,i)=>a+(S.answers[i]===q.answer?1:0),0);
  const h=history(); const d=new Date();
  h.push({d:`${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`, s:score, m:S.mode});
  localStorage.setItem('fr_hist', JSON.stringify(h.slice(-30)));
  const msg = score===10?'🏆 Parfait ! ¡Perfecto, Valeria!':score>=8?'🌟 Très bien ! ¡Muy bien!':score>=6?'👍 Bien ! Vas por buen camino.':score>=5?'🙂 Aprobado. ¡Un poco más de práctica!':'💪 Courage ! Repasa el vocabulario y vuelve a intentarlo.';
  app.innerHTML=`
  <div class="card">
    <div class="score">${score}<small> / 10</small></div>
    <p class="msg">${msg}</p>
    <div class="row" style="margin-top:14px">
      <button class="btn red" onclick="startExam()">🔄 Nuevo examen</button>
      <button class="btn ghost" onclick="showVocab()">📚 Repasar</button>
    </div>
  </div>
  <div class="card">
    <h3 style="margin:0 0 4px">Corrección</h3>
    ${S.exam.map((q,i)=>{
      const a=S.answers[i], ok=a===q.answer;
      return `<div class="rev">
        <div class="ic">${ok?'✅':'❌'}</div>
        <div class="bd">
          <div class="muted" style="font-size:14px">${i+1}. ${esc(q.topic)} · ${esc(q.instr)}</div>
          <div>Has oído: <span class="fr">«${esc(q.say)}»</span></div>
          <div class="muted">= ${esc(q.es)}</div>
          <div>${ok?`Tu respuesta: <span class="good">${esc(q.options[a].text)}</span>`:
            `Tu respuesta: <span class="bad">${esc(q.options[a].text)}</span> · Correcta: <span class="good">${esc(q.options[q.answer].text)}</span>`}</div>
          ${!ok&&q.tip?`<div style="font-size:15px">💡 ${esc(q.tip)}</div>`:''}
        </div>
        <button class="mini" onclick="speak(S.exam[${i}].say,0.85)" aria-label="Escuchar">🔊</button>
      </div>`;}).join('')}
  </div>`;
  window.scrollTo(0,0);
}

/* ================== REPASO DE VOCABULARIO ================== */
function tag(fr,es,extra=''){ return `<button class="tag" onclick="speak(this.dataset.fr,0.85)" data-fr="${esc(fr)}">${extra}<b>${esc(fr)}</b><small>${esc(es)}</small></button>`; }
function showVocab(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  homeBtn.hidden=false;
  const pr=['je','tu','il / elle','nous','vous','ils / elles'], prEs=['yo','tú','él / ella','nosotros','vosotros','ellos / ellas'];
  app.innerHTML=`
  <div class="card"><h2>📚 Repasar</h2><p class="muted" style="margin:0">Toca cualquier palabra para oírla.</p></div>
  <div class="card vsec"><h3>🎨 Les couleurs</h3><div class="tags">
    ${COLORS.map(c=>tag(c.fr===c.frF?c.fr:`${c.fr} / ${c.frF}`, c.es, `<span class="dot" style="background:${c.hex}"></span>`)).join('')}
  </div></div>
  <div class="card vsec"><h3>✏️ Le matériel scolaire</h3><div class="tags">
    ${MATERIALS.map(m=>tag(withArt(m.fr,m.art), `${m.esArt} ${m.es}`, m.e+' ')).join('')}
  </div></div>
  <div class="card vsec"><h3>🔤 Les articles</h3>
    <div class="rule"><b>le</b> = masculino (le livre) · <b>la</b> = femenino (la règle)<br><b>l'</b> = delante de vocal o h (l'ordinateur, l'Espagne) · <b>les</b> = plural (les ciseaux)</div>
  </div>
  <div class="card vsec"><h3>🗣️ Les verbes</h3><div class="grid2">
    ${VERBS.map(v=>`<div><b>${v.inf}</b> <span class="muted">(${v.es})</span>
      <table class="conj">${v.parts.map((p,i)=>{
        const fr = i===2? `il / elle ${p}` : i===5 ? `ils / elles ${p}` : frForm(v,i,pr[i]);
        const sayTxt = i===2? `il ${p}` : i===5? `ils ${p}` : fr;
        return `<tr onclick="speak(this.dataset.fr,0.85)" data-fr="${esc(sayTxt)}"><td>${esc(fr)}</td><td class="muted">${esc(prEs[i]+' '+v.esC[i])}</td></tr>`;}).join('')}</table></div>`).join('')}
  </div></div>
  <div class="card vsec"><h3>🌍 Les pays et les nationalités</h3><div class="tags">
    ${COUNTRIES.map(c=>tag(`${withArt(c.fr,c.art)} — ${c.natM===c.natF?c.natM:c.natM+' / '+c.natF}`, `${c.es} — ${c.esM===c.esF?c.esM:c.esM+' / '+c.esF}`, c.flag+' ')).join('')}
  </div></div>
  <div class="card vsec"><h3>📍 À · En · Au · Aux</h3>
    <div class="rule">
      <b>à</b> + ciudad → J'habite <b>à</b> Paris.<br>
      <b>en</b> + país femenino → J'habite <b>en</b> France / <b>en</b> Espagne / <b>en</b> Italie.<br>
      <b>au</b> + país masculino → J'habite <b>au</b> Portugal / <b>au</b> Maroc / <b>au</b> Royaume-Uni.<br>
      <b>aux</b> + país plural → J'habite <b>aux</b> États-Unis.
    </div>
    <div class="tags" style="margin-top:10px">
      ${["J'habite à Paris.","J'habite en Espagne.","J'habite au Portugal.","J'habite aux États-Unis."].map(s=>tag(s,'')).join('')}
    </div>
  </div>
  <div class="card vsec"><h3>💼 Les professions</h3><div class="tags">
    ${PROFESSIONS.map(p=>tag(p.m===p.f?p.m:`${p.m} / ${p.f}`, p.esM===p.esF?p.esM:`${p.esM} / ${p.esF}`, p.e+' ')).join('')}
  </div></div>
  <button class="btn red block" onclick="startExam()">▶️ ¡Hacer el examen!</button>`;
  window.scrollTo(0,0);
}

goHome();
</script>
